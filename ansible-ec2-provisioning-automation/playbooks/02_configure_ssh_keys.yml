---
- name: Configure passwordless SSH authentication
  hosts: linux_nodes
  gather_facts: false
  become: true

  vars:
    control_node_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Install control node public key on target instances
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ control_node_public_key }}"
        state: present
